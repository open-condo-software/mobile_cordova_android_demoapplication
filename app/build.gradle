plugins {
    id("com.android.application") version "8.6.1"
    id("org.jetbrains.kotlin.android") version "2.0.21"
    id("com.google.devtools.ksp") version "2.0.21-1.0.25"
    id "androidx.navigation.safeargs.kotlin"
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "ai.doma.miniappdemo"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    namespace 'ai.doma.miniappdemo'
}

dependencies {

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2"
    implementation project(path: ':CordovaLib')
    api "com.squareup.retrofit2:retrofit:2.7.1}"
    api "com.squareup.retrofit2:adapter-rxjava2:2.7.1"
    api "com.squareup.retrofit2:converter-gson:2.7.1"
    api "com.squareup.okhttp3:okhttp:4.9.1"
    api 'com.squareup.okhttp3:logging-interceptor:4.0.1'
    api "com.google.dagger:dagger:2.52"
    ksp "com.google.dagger:dagger-compiler:2.52"
    api "com.google.dagger:dagger-android:2.52"
    ksp "com.google.dagger:dagger-android-processor:2.52"
    implementation 'com.github.franmontiel:PersistentCookieJar:v1.0.1'
    implementation "androidx.navigation:navigation-fragment-ktx:2.4.2"
    implementation "androidx.navigation:navigation-ui-ktx:2.4.2"
    implementation "com.dmitryborodin:pdfview-android:1.1.0"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    ksp 'com.github.bumptech.glide:ksp:4.16.0'
}

def isWindows = org.gradle.internal.os.OperatingSystem.current().isWindows()
def npxPath = isWindows
        ? "C:/Program Files/nodejs/npx.cmd"
        : ["/opt/homebrew/bin/npx", "/usr/local/bin/npx", "/usr/bin/npx"]
        .find { new File(it).exists() } ?: "npx" // fallback


tasks.register('updateCordovaProjectToDemo') {
    exec {
        workingDir = file('../MainCordovaApplication')
        commandLine npxPath, 'cordova', 'platform', 'remove', 'android'
    }

    exec {
        workingDir = file('../MainCordovaApplication')
        commandLine npxPath, 'cordova', 'platform', 'add', 'android'
    }

    exec {
        workingDir = file('../MainCordovaApplication')
        commandLine npxPath, 'cordova', 'prepare', 'android'
    }

    dependsOn 'copyWww'
}

tasks.register('zipWww', Zip) {
    from('../MainCordovaApplication/platforms/android/app/src/main/assets/www')
    destinationDirectory = file('../MainCordovaApplication/platforms/android/app/src/main/assets')
    archiveFileName = 'www.zip'
}
tasks.register('copyWww', Copy) {
    dependsOn 'zipWww'
    from('../MainCordovaApplication/platforms/android/app/src/main/assets/www.zip')
    into('src/main/res/raw')
}

preBuild.dependsOn updateCordovaProjectToDemo